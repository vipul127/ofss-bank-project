server:
  port: 8082
spring:
  application:
    name: cash-management-service
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: bankroot
    password: bankroot123
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.OracleDialect
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    ip-address: 127.0.0.1
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
openrouter:
  api-key: "sk-"
  model: "openrouter/free"
  url: "https://openrouter.ai/api/v1/chat/completions"
ai:
  # How long a cached branch/admin AI response is served before the next request triggers a
  # real refresh (forecast lookup + OpenRouter call). Freshness is a plain timestamp comparison
  # against AI_INSIGHT_CACHE.LAST_UPDATED, not something the AI is asked to judge itself.
  cache-ttl-minutes: 10
